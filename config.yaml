# 访客机 Agent 配置（复制为本地修改；token 需与 console config 一致）
# 在虚拟机内禁止使用 127.0.0.1（那是访客机自己）
# NAT(VMnet8) 常用宿主机网关: 192.168.159.1
# Host-Only(VMnet1) 常用: 192.168.150.1

host: "192.168.0.193"
port: 18765
token: "CHANGE_ME"

vm_id: "VM-01"
vm_name: "联调测试机"
wechat_account_label: "微信客服A"

enable_wechat: true
enable_remote: true
# 宿主机已为这台虚拟机打开 VNC Connections 时改为 vnc。
# 端口和口令写在控制台库存里，不要写在这里。
remote_view: jpeg
include_self: true
listen_interval: 1.2
listen_blacklist:
  - "订阅号"
  - "服务通知"

# WebSocket 保活（需与 console config 一致）；低配 VM 可适当加大
ws_ping_interval_sec: 60
ws_ping_timeout_sec: 120

# 登录自启默认参数（改完需再执行 --autostart install 才会写入注册表）
# 测试空跑示例: extra_args: ["--no-wechat"]
autostart:
  extra_args: ["--no-wechat"]
